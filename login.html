<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk - GoodFood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html">
          <img src="assets/good food icon.png" alt="GoodFood" />
          <div>
            <span class="brand-title">GoodFood</span>
                      </div>
        </a>
        <nav class="nav-links">
          <a href="register.html">Daftar</a>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="container" style="max-width: 520px">
        <div class="card">
          <div class="section-title">
            <h2>Masuk akun</h2>
            <p>Selamat datang kembali.</p>
          </div>
          <form id="loginForm">
            <div class="form-row">
              <label for="loginEmail">Email</label>
              <input
                class="input"
                type="email"
                id="loginEmail"
                placeholder="nama@email.com"
                required
              />
            </div>
            <div class="form-row">
              <label for="loginPassword">Password</label>
              <input
                class="input"
                type="password"
                id="loginPassword"
                placeholder="Minimal 6 karakter"
                required
              />
            </div>
            <div id="loginError" style="color: #b91c1c; margin-bottom: 12px"></div>
            <div class="form-actions">
              <button class="btn btn-primary" type="submit">Masuk</button>
              <a class="btn btn-ghost" href="register.html">Buat akun baru</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
